[leveling]
	#XP needed for level 1 -> 2 before growth is applied.
	# Default: 100
	# Range: 1 ~ 1000000
	baseXp = 100
	#Progressive XP curve multiplier. Needed XP = baseXp * level ^ growth.
	# Default: 1.55
	# Range: 1.0 ~ 5.0
	xpGrowth = 1.55

	[skills.woodcutting]
		enabled = true
		# Default: 10
		# Range: 0 ~ 1000000
		xpReward = 10
		#Per-level bonus scale. Effects interpret this as chance/speed/damage as appropriate.
		# Default: 0.004
		# Range: 0.0 ~ 10.0
		bonusPerLevel = 0.004

