# PatchLib Patch Configuration
# Set a patch to 'false' to prevent it from loading.
# Changes require a full server/client restart.
# Patches for mods that are not installed are automatically skipped.

# --- arclight ---
# Fixes ClassCastException when mod entities run Villager AI tasks
arclight.villager_career_cast=true
# Catches NPE/ClassCastException in Villager Brain.tick from Arclight redirects
arclight.villager_ai_safety=true
# Fixes ClassCastException for Friends&Foes WildfireShieldDebrisEntity
arclight.fnf_entity_mapper=true

# --- vampirism ---
# Prevents NPE in ActionHandler.deactivateAllActions on Arclight
vampirism.action_handler_npe=true

# --- compat ---
# Prevents YUNG's Better End Island from double-spawning the Ender Dragon
compat.yungs_dragon_spawn=true
# Catches NPE in Create ContraptionCollider when MovementFace axis is null
compat.create_contraption_collider=true

# --- toxony ---
# Serializes ThrownOilPot.itemStack to NBT so it survives chunk reload; guards onHit against null (Toxony 0.10.5/0.10.6 never persist the field, causing a crash after restart)
toxony.oil_pot_null_fields=true

# --- prickle ---
# Resolves Prickle's property adapters through the owning classloader instead of the thread context one, so the config file format stops flipping between runs (Prickle 21.1.8)
prickle.service_loader_classloader=true
# Falls back to default values when a Prickle config cannot be parsed instead of aborting the datapack load and hanging the server; keeps a copy of the unreadable file
prickle.tolerant_config_load=true

# --- toms_storage ---
# Treats a retired NeoForge BlockCapabilityCache as an empty inventory instead of throwing IllegalStateException out of InventoryConnectorBlockEntity ticking (Tom's Simple Storage 2.2.1)
toms_storage.stale_capability_cache=true

# --- farmersdelight ---
# Rebuilds Farmer's Delight tag keys that stayed null because of mod load order
farmersdelight.tag_load_order=true

# --- portabletanks ---
# Treats a portable tank without fluid NBT as empty instead of throwing NullPointerException
portabletanks.fluid_nbt_npe=true

# --- copperagebackport ---
# Gives Copper Age Backport armour the durability it was registered without
copperagebackport.armor_durability=true

# --- subtle_effects ---
# Registers the End Remastered portal frame ticker as a state predicate so the effect actually plays
subtle_effects.end_remastered_ticker=true

# --- kubejs ---
# Prevents ClassCastException in KubeJS capability registration when a pack registers non-block-entity builders
kubejs.capability_builder_cast=true
# Prevents ClassCastException while server scripts load when a pack registers non-item builders
kubejs.item_builder_cast=true

# --- jeresources ---
# Makes Just Enough Resources read biomes from the loaded world instead of the vanilla-only lookup, so modded biomes stop dropping out of its tabs
jeresources.modded_biome_lookup=true

# --- patchouli ---
# Resolves Patchouli book cover items against the loaded world's registries so modded covers work
patchouli.book_registry_lookup=true

