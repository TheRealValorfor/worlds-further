minecraftVersion = "1.21.1"
modLoader = "NeoForge"
modLoaderVersion = "21.1.250"

includeServerIcon = false
includeServerProperties = true
serverPropertiesPath = "/Users/joshie/Documents/curseforge/minecraft/Instances/Ejomilishy/tools/ServerPackCreator/server.properties"
includeZipCreation = false
serverPackSuffix = ""
serverIconPath = ""

# Pack default 8G heap + ZGC flags from user_jvm_args.txt / ADDITIONAL_JVM_ARGS.txt
javaArgs = "-Xms8G -Xmx8G -XX:+UnlockExperimentalVMOptions -XX:+UseZGC -XX:+ZGenerational -XX:+AlwaysPreTouch -XX:+PerfDisableSharedMem -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Dlog4j2.formatMsgNoLookups=true"

[scripts]
	SPC_JAVA_SPC = "java"

# Explicit copies only — no saves/, logs/, crash-reports/, .cursor/, quest-tools/,
# mods-disabled/, shaderpacks/, resourcepacks/, fancymenu_data/, Distant_Horizons_server_data/.
[[inclusions]]
	destination = ""
	source = "mods"
	inclusionFilter = ""
	exclusionFilter = ""

[[inclusions]]
	destination = ""
	source = "config"
	inclusionFilter = ""
	exclusionFilter = "fancymenu[/\\\\].*|iris\\.properties|DistantHorizons\\.toml|jei[/\\\\]world[/\\\\].*|inventoryprofilesnext[/\\\\]New World.*"

[[inclusions]]
	destination = ""
	source = "defaultconfigs"
	inclusionFilter = ""
	exclusionFilter = ""

[[inclusions]]
	destination = ""
	source = "datapacks"
	inclusionFilter = ""
	exclusionFilter = ""

[[inclusions]]
